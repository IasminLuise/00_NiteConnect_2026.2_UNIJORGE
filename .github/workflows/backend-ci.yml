name: Backend CI
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-ci.yml'
permissions:
  contents: read
jobs:
  verify-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Verify and run PostgreSQL integration tests
        run: mvn --batch-mode -f apps/api/pom.xml verify
