name: Backend CI
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'infra/cloudflare/**'
      - 'docs/implementation/staging-bloco-02.md'
      - 'docs/superpowers/specs/2026-10-16-bloco-02-staging-design.md'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**', 'infra/**']
    paths:
      - 'apps/api/**'
      - 'infra/cloudflare/**'
      - 'docs/implementation/staging-bloco-02.md'
      - 'docs/superpowers/specs/2026-10-16-bloco-02-staging-design.md'
      - '.github/workflows/backend-ci.yml'
permissions:
  contents: read
jobs:
  verify-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Verify and run PostgreSQL integration tests
        run: mvn --batch-mode -f apps/api/pom.xml verify
      - name: Build Cloudflare Container image
        run: docker build --platform linux/amd64 --tag nite-connect-api:${{ github.sha }} apps/api
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/cloudflare/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
        working-directory: infra/cloudflare
      - name: Typecheck Worker and generate binding types
        run: npm run typecheck
        working-directory: infra/cloudflare
      - name: Validate Wrangler bundle without deployment
        run: npm run dry-run
        working-directory: infra/cloudflare
      - name: Publish verified JAR for the one-time bootstrap
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nite-connect-staging-bootstrap-${{ github.sha }}
          path: apps/api/target/nite-connect-api-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14
