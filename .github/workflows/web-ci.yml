name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/design-system/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/design-system/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  verify-web:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web
      - name: Lint, typecheck, test, and build
        run: npm run check
        working-directory: apps/web
