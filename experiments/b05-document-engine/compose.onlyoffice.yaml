name: nite-b05-onlyoffice
services:
  wopi-host:
    image: nite-b05-wopi:local
    user: "10001:10001"
    ports: ["127.0.0.1:18086:8080"]
    environment:
      LAB_DATA: /data
      LAB_FIXTURES: /fixtures
      LAB_ORIGIN: http://localhost:18086
      ONLYOFFICE_INTERNAL: http://onlyoffice:80
      ONLYOFFICE_PUBLIC: http://localhost:19981
    volumes:
      - ./.runtime/onlyoffice/data:/data
      - ./.runtime/onlyoffice/fixtures:/fixtures:ro
    mem_limit: 512m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [comparison]
  onlyoffice:
    image: onlyoffice/documentserver:10.0.0.1@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
    environment:
      WOPI_ENABLED: "true"
      JWT_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
    shm_size: 256m
    mem_limit: 4g
    cpus: 2.0
    volumes:
      - ./.runtime/onlyoffice/cache:/var/lib/onlyoffice
      - ./.runtime/onlyoffice/logs:/var/log/onlyoffice
      - ./.runtime/onlyoffice/keys:/var/www/onlyoffice/Data
    networks: [comparison]
  gateway:
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    ports: ["127.0.0.1:19981:8080"]
    volumes:
      - ./gateway/onlyoffice.conf:/etc/nginx/nginx.conf:ro
    depends_on: [onlyoffice]
    mem_limit: 64m
    networks: [comparison]
networks:
  comparison:
    driver: bridge
