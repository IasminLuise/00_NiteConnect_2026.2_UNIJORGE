name: nite-connect-staging
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: niteconnect_staging
      POSTGRES_USER: niteconnect
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo operacional externo}
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niteconnect -d niteconnect_staging"]
      interval: 5s
      timeout: 5s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: nite-connect-api:${STAGING_IMAGE_TAG:?Defina o SHA da imagem carregada}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STAGING_API_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/niteconnect_staging
      DB_USERNAME: niteconnect
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo operacional externo}
      ENTRA_ENABLED: "true"
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Defina o tenant institucional}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?Defina o client ID da API}
      ENTRA_REQUIRED_SCOPE: ${ENTRA_REQUIRED_SCOPE:?Defina o escopo delegado}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  staging_postgres:
