spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: nite-connect-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:niteconnect}}
    username: ${DB_USERNAME:niteconnect}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nite_connect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
    include-stacktrace: never
nite:
  entra:
    enabled: ${ENTRA_ENABLED:false}
    tenant-id: ${ENTRA_TENANT_ID:}
    audience: ${ENTRA_AUDIENCE:}
    required-scope: ${ENTRA_REQUIRED_SCOPE:}
