spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: nite-connect-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:niteconnect}}
    username: ${DB_USERNAME:niteconnect}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nite_connect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${FLYWAY_USERNAME:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
    include-stacktrace: never
nite:
  entra:
    enabled: ${ENTRA_ENABLED:false}
    tenant-id: ${ENTRA_TENANT_ID:}
    audience: ${ENTRA_AUDIENCE:}
    required-scope: ${ENTRA_REQUIRED_SCOPE:}
  documents:
    local-development: ${DOCUMENTS_LOCAL_DEVELOPMENT:false}
    storage-root: ${DOCUMENTS_STORAGE_ROOT:}
    public-base-url: ${DOCUMENTS_PUBLIC_BASE_URL:}
    capability-secret: ${DOCUMENTS_CAPABILITY_SECRET:}
    inspection:
      enabled: ${DOCUMENTS_INSPECTION_ENABLED:false}
    editor:
      enabled: ${DOCUMENTS_EDITOR_ENABLED:false}
      server-url: ${DOCUMENTS_EDITOR_SERVER_URL:}
      jwt-secret: ${DOCUMENTS_EDITOR_JWT_SECRET:}
      allow-insecure-loopback: ${DOCUMENTS_EDITOR_ALLOW_INSECURE_LOOPBACK:false}
