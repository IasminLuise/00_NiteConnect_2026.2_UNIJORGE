spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: nite-connect-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:niteconnect}}
    username: ${DB_USERNAME:niteconnect}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nite_connect
  flyway:
    enabled: true
    locations: classpath:Migrations
    validate-migration-naming: true
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${FLYWAY_USERNAME:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
    include-stacktrace: never
nite:
  entra:
    enabled: ${ENTRA_ENABLED:false}
    tenant-id: ${ENTRA_TENANT_ID:}
    audience: ${ENTRA_AUDIENCE:}
    required-scope: ${ENTRA_REQUIRED_SCOPE:}
  justification:
    local-root: ${JUSTIFICATION_ATTACHMENT_LOCAL_ROOT:}
    storage:
      approved: ${JUSTIFICATION_ATTACHMENT_STORAGE_APPROVED:false}
    retention:
      authorized-validator-ids: ${JUSTIFICATION_RETENTION_AUTHORIZED_VALIDATOR_IDS:}
      purge:
        enabled: ${JUSTIFICATION_ATTACHMENT_RETENTION_PURGE_ENABLED:false}
        execution-enabled: ${JUSTIFICATION_ATTACHMENT_RETENTION_PURGE_EXECUTION_ENABLED:false}
        dry-run: ${JUSTIFICATION_ATTACHMENT_RETENTION_PURGE_DRY_RUN:true}
        cron: ${JUSTIFICATION_ATTACHMENT_RETENTION_PURGE_CRON:0 15 2 * * *}
        zone: ${JUSTIFICATION_ATTACHMENT_RETENTION_PURGE_ZONE:UTC}
